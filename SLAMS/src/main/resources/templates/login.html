<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLAMS - Login</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts - Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#0F766E',
                        brandDark: '#0B5E58',
                        brandLight: '#E6F4F1',

                        success: '#059669',
                        warning: '#D97706',
                        danger: '#DC2626',

                        page: '#F8FAFC',
                        surface: '#FFFFFF',
                        line: '#E2E8F0',

                        textMain: '#0F172A',
                        textSoft: '#334155',
                        textMuted: '#64748B',
                        textFaint: '#94A3B8'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    boxShadow: {
                        soft: '0 12px 30px -14px rgba(15, 23, 42, 0.12)',
                        brand: '0 10px 24px -12px rgba(15, 118, 110, 0.28)'
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #F8FAFC;
            color: #0F172A;
            font-family: 'Inter', sans-serif;
        }

        .input-glow:focus {
            box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12);
            border-color: #0F766E;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4 text-textSoft bg-page">

    <div class="w-full max-w-sm">
        <!-- Logo Header -->
        <div class="text-center mb-8">
            <!-- keeping leaf logo as requested -->
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-brandLight text-brand text-2xl mb-4 border border-brand/10 shadow-sm">
                <i class="fa-solid fa-leaf"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-textMain">SLAMS</h1>
            <p class="text-textMuted text-sm mt-1">Leave & Attendance System</p>
        </div>

        <!-- Login Form Card -->
        <div class="bg-surface rounded-3xl p-8 border border-line shadow-soft">

            <!-- Error Banner -->
            <div id="errorBanner" class="hidden mb-6 p-4 rounded-xl bg-red-50 border border-red-100 text-red-600 text-sm flex items-start space-x-2">
                <i class="fa-solid fa-circle-exclamation mt-0.5"></i>
                <span id="errorMessage">Invalid credentials</span>
            </div>

            <!-- Form -->
            <form id="loginForm" class="space-y-4">

                <!-- Username -->
                <div>
                    <label class="block text-xs font-semibold text-textMuted mb-1.5">Employee ID / Username</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400 text-sm">
                            <i class="fa-regular fa-user"></i>
                        </span>
                        <input type="text" id="username" name="username" required
                               class="w-full pl-9 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-textMain placeholder-slate-400 outline-none transition-all duration-200 input-glow"
                               placeholder="Enter your ID">
                    </div>
                </div>

                <!-- Password -->
                <div>
                    <label class="block text-xs font-semibold text-textMuted mb-1.5">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400 text-sm">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" id="password" name="password" required
                               class="w-full pl-9 pr-10 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-textMain placeholder-slate-400 outline-none transition-all duration-200 input-glow"
                               placeholder="••••••••">
                        <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-brand transition-colors">
                            <i id="eyeIcon" class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="flex items-center justify-between pb-2">
                    <label class="flex items-center space-x-2 cursor-pointer">
                        <input type="checkbox" class="w-3.5 h-3.5 text-brand border-slate-300 rounded focus:ring-brand">
                        <span class="text-xs text-textMuted">Remember me</span>
                    </label>
                    <a href="#" class="text-xs font-medium text-brand hover:text-brandDark transition-colors">Forgot password?</a>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submitBtn"
                        class="w-full py-2.5 bg-brand hover:bg-brandDark text-white text-sm font-semibold rounded-xl shadow-brand transition-colors flex items-center justify-center space-x-2">
                    <span>Sign In</span>
                    <i class="fa-solid fa-arrow-right-to-bracket text-xs"></i>
                </button>
            </form>
        </div>

        <!-- Footer -->
        <p class="text-center text-xs text-slate-400 mt-8">&copy; 2026 SLAMS. Enterprise Portal.</p>
    </div>

    <script>
        function togglePassword() {
            const pwdField = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            if (pwdField.type === 'password') {
                pwdField.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                pwdField.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            const errorBanner = document.getElementById('errorBanner');
            const errorMessage = document.getElementById('errorMessage');

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> <span>Authenticating...</span>`;
            errorBanner.classList.add('hidden');

            const payload = {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            };

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    submitBtn.innerHTML = `<i class="fa-solid fa-circle-check text-xs"></i> <span>Success</span>`;
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 500);
                } else {
                    const errData = await response.json();
                    throw new Error(errData.error || errData.message || 'Invalid username or password.');
                }
            } catch (err) {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>Sign In</span> <i class="fa-solid fa-arrow-right-to-bracket text-xs"></i>`;
                errorMessage.textContent = err.message;
                errorBanner.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
