# Main Configuration
slams.delegation.enabled=${SLAMS_DELEGATION_ENABLED:false}
slams.delegation.issuer=${SLAMS_DELEGATION_ISSUER:}
slams.delegation.audience=${SLAMS_DELEGATION_AUDIENCE:}
slams.delegation.public-key=${SLAMS_DELEGATION_PUBLIC_KEY:}
spring.profiles.active=h2
spring.application.name=slams
server.port=8080

# Thymeleaf Settings (No caching in development for hot reloading)
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# JWT Configuration (256-bit Hex Key for signing)
slams.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
slams.jwt.expiration=86400000
assistant.proxy.base-url=http://localhost:8000
assistant.proxy.jwt-secret=replace-in-runtime-environment
assistant.proxy.issuer=slams-assistant-proxy
assistant.proxy.audience=agentic-rag-assistant

# Attendance Cutoff Settings (24-hour format)
slams.attendance.cutoff-time=09:30:00

# Mock Mail Properties (For simulation)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=mock@example.com
spring.mail.password=mockpassword
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
