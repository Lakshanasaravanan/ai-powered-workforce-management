# Main Configuration
slams.delegation.enabled=${SLAMS_DELEGATION_ENABLED:false}
slams.delegation.issuer=${SLAMS_DELEGATION_ISSUER:}
slams.delegation.audience=${SLAMS_DELEGATION_AUDIENCE:}
slams.delegation.public-key=${SLAMS_DELEGATION_PUBLIC_KEY:}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}
spring.application.name=slams
server.port=8080

# Thymeleaf Settings (No caching in development for hot reloading)
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# JWT Configuration (256-bit Hex Key for signing)
slams.jwt.secret=${SLAMS_JWT_SECRET:development-only-change-me}
slams.jwt.expiration=86400000
assistant.proxy.base-url=${ASSISTANT_PROXY_BASE_URL:http://localhost:8000}
assistant.proxy.jwt-secret=${ASSISTANT_PROXY_JWT_SECRET:development-only-change-me}
assistant.proxy.issuer=${ASSISTANT_PROXY_ISSUER:slams-assistant-proxy}
assistant.proxy.audience=${ASSISTANT_PROXY_AUDIENCE:agentic-rag-assistant}

# Attendance Cutoff Settings (24-hour format)
slams.attendance.cutoff-time=09:30:00

# Mock Mail Properties (For simulation)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=mock@example.com
spring.mail.password=mockpassword
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
